---
name: validate-chronik-fixtures
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  check-files:
    name: check fixture presence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: report
        run: |
          if [ -f "tests/fixtures/chronik.jsonl" ] || [ -f "demo/chronik.jsonl" ]; then
            echo "chronik fixture files are present"
          else
            echo "no chronik fixture files are present"
          fi
