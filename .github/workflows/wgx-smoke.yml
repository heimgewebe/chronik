---
name: wgx-smoke

"on":
  workflow_dispatch:
  push:
    paths:
      - ".wgx/**"
      - "docs/wgx-konzept.md"
      - ".github/workflows/wgx-smoke.yml"
      - "pyproject.toml"
      - "Cargo.toml"
      - "**/*.py"
      - "**/*.rs"
      - "requirements.txt"
      - "requirements-dev.txt"

permissions:
  contents: read

jobs:
  smoke:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@6107899aaec1866087e4f99bacca2488282ba0b8
    with:
      mode: smoke
    permissions:
      contents: read
