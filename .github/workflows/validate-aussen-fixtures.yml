---
name: validate (aussen fixtures)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    name: fixtures (aussen JSONL)
    uses: heimgewebe/metarepo/.github/workflows/reusable-validate-jsonl.yml@ec7cdbb6e8b4d76a17b3bdc8bdc2b1c590b6a0d2
    with:
      jsonl_path: tests/fixtures/aussen/sample-ok.jsonl
      schema_url: https://raw.githubusercontent.com/heimgewebe/contracts-mirror/contracts-v1/json/aussen.event.schema.json
      strict: false
      validate_formats: true
