---
name: validate (aussen fixtures)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fixtures:
    name: fixtures (aussen JSONL)
    uses: heimgewebe/metarepo/.github/workflows/reusable-validate-jsonl.yml@5afd566efb27fb6594ff32daa4d3b86c5184ba30
    with:
      jsonl_path: tests/fixtures/aussen/sample-ok.jsonl
      schema_url: https://raw.githubusercontent.com/heimgewebe/contracts-mirror/contracts-v1/json/aussen.event.schema.json
      strict: false
      validate_formats: true
