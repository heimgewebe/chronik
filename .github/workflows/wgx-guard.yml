---
name: wgx-guard

"on":
  push:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "Cargo.toml", "**/*.py", "**/*.rs", "requirements.txt", "requirements-dev.txt"]
  pull_request:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "Cargo.toml", "**/*.py", "**/*.rs", "requirements.txt", "requirements-dev.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@9d985c3a426d387173d8753b09dd5175a242a7d5
    with:
      mode: guard
    permissions:
      contents: read
