---
name: wgx-guard

"on":
  push:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "ruff.toml", "mypy.ini", "Cargo.toml", "**/*.py", "**/*.rs", "requirements.txt", "requirements-dev.txt"]
  pull_request:
    paths: [".wgx/**", ".github/workflows/wgx-guard.yml", "pyproject.toml", "ruff.toml", "mypy.ini", "Cargo.toml", "**/*.py", "**/*.rs", "requirements.txt", "requirements-dev.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    # Compatibility filename only: verification policy is owned by Metarepo.
    uses: heimgewebe/metarepo/.github/workflows/reusable-repo-verify.yml@bf9e0ba587f7488994617ee849914839a87238ae
    with:
      mode: guard
    permissions:
      contents: read
