openapi: 3.0.3
info:
  title: Chronik API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8788
    description: Development server
paths:
  /v1/ingest:
    post:
      summary: Universal ingest endpoint
      operationId: ingestEvent
      description: |
        Accepts JSON payloads either as a single object, an array of objects, or newline-delimited JSON.
        The target domain can be supplied via the `domain` query parameter (canonical) or as the `domain` field on the first
        object in the payload (payload compatibility, normalized by Chronik).

        **Canonical Endpoint**: `POST /v1/ingest?domain=heimgeist`

        **Transport Policy**:
        - Max payload size: 1MB (configurable via `CHRONIK_MAX_BODY`).
        - Rate limit: 60 requests per minute (configurable via `CHRONIK_RATE_LIMIT`).

        **Validation**:
        - For domain `heimgeist`, Schema is defined in metarepo. Chronik enforces, not defines.
        - Required wrapper fields: `kind`, `version`, `id`, `meta` (with `occurred_at`), `data`.
      parameters:
        - name: domain
          in: query
          description: Optional target domain for the event. If omitted, the first payload object must contain `domain`.
          required: false
          schema:
            type: string
      security:
        - XAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/Event'
                - type: array
                  items:
                    $ref: '#/components/schemas/Event'
            example:
              kind: "heimgeist.insight"
              version: 1
              id: "evt-12345678"
              meta:
                occurred_at: "2023-10-27T10:00:00Z"
                role: "agent"
              data:
                key: "value"
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON objects. Empty lines are ignored.
      responses:
        '202':
          description: Accepted. Body contains plain text `ok`.
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '400':
          description: Bad request (invalid domain, JSON, payload, or missing domain information).
        '401':
          description: Unauthorized (missing or invalid `X-Auth` header).
        '411':
          description: Content-Length header missing.
        '413':
          description: Payload too large.
        '415':
          description: Unsupported content-type.
        '422':
          description: Semantic validation failed (e.g. summary too long).
        '429':
          description: Too many requests (rate limited). Clients should respect the `Retry-After` header.
        '507':
          description: Insufficient storage.
  /health:
    get:
      summary: Health check
      operationId: getHealth
      description: "Returns `{\"status\": \"ok\"}` when the service is ready."
      security:
        - XAuth: []
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          description: Unauthorized (missing or invalid `X-Auth` header).
  /version:
    get:
      summary: Service version
      operationId: getVersion
      description: Returns the current Chronik version string.
      security:
        - XAuth: []
      responses:
        '200':
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
  /v1/chronik/search:
    get:
      summary: Search canonical Chronik agent ledger without writing it
      operationId: searchChronikHistory
      description: |
        Exhaustive validated read of the committed agent.ledger snapshot.
        Search filters are combined with logical AND. A host event may match
        the producer source.repo even without subject.repo.
        Results are historical evidence only, not live runtime truth.
        Cursors are bound to filters and ledger SHA-256; restart after changes.
      security:
        - XAuth: []
      parameters:
        - name: event_id
          in: query
          schema: {type: string}
        - name: repo
          in: query
          schema: {type: string}
        - name: host
          in: query
          schema: {type: string}
        - name: component
          in: query
          schema: {type: string}
        - name: subject_component
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema: {type: string}
        - name: operation
          in: query
          schema: {type: string}
        - name: task_class
          in: query
          schema: {type: string}
        - name: outcome
          in: query
          schema: {type: string}
        - name: pr_number
          in: query
          schema: {type: integer, minimum: 1}
        - name: bureau_task_id
          in: query
          schema: {type: string}
        - name: run_id
          in: query
          schema: {type: string}
        - name: task_id
          in: query
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: until
          in: query
          schema: {type: string, format: date-time}
        - name: keyword
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Matching history with canonical IDs, snapshot hash, pagination and completeness.
        '400':
          description: Invalid selector or cursor.
        '401':
          description: Authentication required.
        '403':
          description: Invalid authentication token.
        '409':
          description: Cursor bound to an earlier ledger snapshot; restart search.
        '503':
          description: Invalid ledger records or unavailable storage.
  /v1/chronik/events/{event_id}:
    get:
      summary: Read one exact canonical Chronik event
      operationId: getChronikEvent
      description: |
        Returns stored, schema-validated original payload and its
        canonical event SHA-256 plus ledger-snapshot integrity binding.
      security:
        - XAuth: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Matching canonical event and evidence references.
        '400':
          description: Malformed event identifier.
        '401':
          description: Authentication required.
        '403':
          description: Invalid authentication token.
        '404':
          description: No matching event in the committed ledger snapshot.
        '503':
          description: Invalid ledger records or unavailable storage.
  /v1/integrity:
    get:
      summary: Integrity view
      operationId: getIntegrity
      description: |
        Returns the latest integrity status for all known repositories (domains starting with `integrity.`).
        Only returns events with `payload.type` equal to `integrity.summary.published.v1`.

        **Note:** This endpoint returns Chronik's storage/view envelope; it is not the forwarded input event format.
        - Input Event: Has a top-level `type` field.
        - Storage/View: The input event is wrapped in `payload`, so the type is found at `payload.type`.
      security:
        - XAuth: []
      responses:
        '200':
          description: A dictionary mapping domains to their latest integrity event.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/IntegrityViewEvent'
components:
  securitySchemes:
    XAuth:
      type: apiKey
      in: header
      name: X-Auth
  schemas:
    Event:
      type: object
      description: |
        Generic event payload. Additional fields are preserved.
        No fields are unconditionally required. The `domain` field is required in the payload only
        when not supplied via the `domain` query parameter on /v1/ingest.
      required: []
      properties:
        domain:
          type: string
          description: Domain associated with the event. Required unless supplied via query parameter on /v1/ingest.
        summary:
          type: string
          description: Optional summary (maximum 500 characters).
          maxLength: 500
      additionalProperties: true
    IntegrityViewEvent:
      type: object
      description: |
        The canonical structure returned by the integrity view (Chronik envelope).
        Contains the domain, received timestamp, and the original input payload.
      properties:
        domain:
          type: string
        received_at:
          type: string
          format: date-time
        payload:
          type: object
          description: The original input event (where `type` is a field).
          properties:
            type:
              type: string
              enum: [integrity.summary.published.v1]
            repo:
              type: string
            status:
              type: string
              enum: [OK, WARN, FAIL, MISSING, UNCLEAR]
            url:
              type: string