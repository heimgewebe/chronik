wgx:
  apiVersion: v1
  repoKind: python-service
  tasks:
    smoke: |
      set -euxo pipefail
      bash scripts/setup-venv.sh
      . .venv/bin/activate
      export CHRONIK_TOKEN="${CHRONIK_TOKEN:-dev}"
      python3 -m pytest -q tests/test_ingest_client.py::test_ingest_event_hermetic
    guard: |
      set -euxo pipefail
      # Keep CI and local verification on one canonical path. This executes the
      # role contract, Ruff, Mypy, pytest and the hermetic API persistence smoke.
      bash scripts/validate-local.sh
    metrics: |
      set -euxo pipefail
      if [ -x scripts/wgx-metrics-snapshot.sh ]; then
        scripts/wgx-metrics-snapshot.sh --json
      else
        echo "[wgx.metrics] scripts/wgx-metrics-snapshot.sh fehlt, übersprungen"
      fi
    snapshot: |
      set -euxo pipefail
      bash scripts/setup-venv.sh
      . .venv/bin/activate
      python3 -m pytest -q
